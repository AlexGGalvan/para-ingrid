<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#08040a">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="flower.css">
    <title>Ramo para Ingrid</title>
    <script>
        (function registerFreshSW() {
            if (!("serviceWorker" in navigator)) return;
            try {
                navigator.serviceWorker.register("sw.js").then(function (reg) {
                    if (reg && typeof reg.update === "function") {
                        reg.update().catch(function () {});
                    }
                }).catch(function () {});
            } catch (err) {}
        })();
    </script>
</head>

<body>
    <main class="bouquet-scene" aria-label="Ramo virtual para Ingrid">
        <a class="back-link" href="index.html" aria-label="Volver al menu">Volver</a>
        <div class="night-sky" aria-hidden="true">
            <span class="moon-glow"></span>

            <span class="aurora aurora-two"></span>
            <div class="stars" id="stars"></div>
            <div class="fireflies" id="fireflies"></div>

        <section class="bouquet-stage" aria-label="Ramo virtual con gerberas, rosas, claveles, gypsophila y mariposas doradas">

                <p>¿Y si empiezas a tocar las flores? Tal vez guarden algo para ti.</p>
            </header>

                    <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
                        <g class="constellation__lines">
                            <polyline points="20,18 30,8 38,22 58,22 66,8 76,18 80,40 66,62 50,68 34,62 20,40 20,18" />
                            <line x1="34" y1="40" x2="42" y2="50" />
                            <line x1="66" y1="40" x2="58" y2="50" />
                            <line x1="42" y1="50" x2="58" y2="50" />
                            <line x1="50" y1="50" x2="50" y2="58" />
                        </g>
                        <g class="constellation__stars">
                            <circle cx="20" cy="18" r="1.6" />
                            <circle cx="30" cy="8" r="1.4" />
                            <circle cx="38" cy="22" r="1.2" />
                            <circle cx="58" cy="22" r="1.2" />
                            <circle cx="66" cy="8" r="1.4" />
                            <circle cx="76" cy="18" r="1.6" />
                            <circle cx="80" cy="40" r="1.4" />
                            <circle cx="66" cy="62" r="1.5" />
                            <circle cx="50" cy="68" r="1.4" />
                            <circle cx="34" cy="62" r="1.5" />
                            <circle cx="20" cy="40" r="1.4" />
                            <circle cx="34" cy="40" r="2" class="constellation__eye" />
                            <circle cx="66" cy="40" r="2" class="constellation__eye" />
                            <circle cx="50" cy="54" r="1.4" />
                        </g>
                    </svg>
                    <figcaption>Panda</figcaption>
                </figure>

                <figure class="constellation constellation--koala">
                    <svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
                        <g class="constellation__lines">

                    </svg>
